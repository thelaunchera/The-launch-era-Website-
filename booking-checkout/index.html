<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening secure checkout — The Launch Era</title>
<style>
:root{--ivory:#FAF8F3;--paper:#fff;--ink:#292723;--charcoal:#45423D;--yellow:#E7D88A;--line:#D8D1C6;--muted:#756F67}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 22px 60px rgba(41,39,35,.08)}
.brand{font-size:12px;font-weight:800;letter-spacing:.09em}.kicker{display:inline-flex;margin:24px 0 10px;padding:7px 10px;border-radius:999px;background:#F0E7B6;font-size:11px;font-weight:700}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:0 0 12px;font-weight:650}p{color:var(--muted);line-height:1.6;margin:0 0 18px}.dots{display:flex;gap:6px;margin:20px 0}.dots span{width:8px;height:8px;border-radius:50%;background:var(--charcoal);animation:pulse 1s infinite ease-in-out}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}button{width:100%;border:0;border-radius:999px;background:var(--charcoal);color:#fff;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer}button[hidden]{display:none}.small{font-size:12px;color:var(--muted);margin-top:14px}@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N5BHMC432Q"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-N5BHMC432Q');</script>
</head>
<body>
<main class="card">
<div class="brand">THE LAUNCH ERA</div>
<div class="kicker" id="kicker">BOOKING PAGE + CLEANING APP</div>
<h1 id="title">Opening your secure checkout…</h1>
<p id="copy">$39.99 one-time · Professional Booking Page + 2 months of Cleaning App access.</p>
<div class="dots" id="dots"><span></span><span></span><span></span></div>
<button id="retry" type="button" hidden>Try again</button>
<div class="small" id="status">You’ll continue securely with Stripe.</div>
</main>
<script>
const endpoint="https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/create-booking-page-checkout";
const lang=new URLSearchParams(location.search).get("lang")||localStorage.getItem("tle_app_lang")||localStorage.getItem("tle_language")||"en";
const es=lang==="es";
const title=document.getElementById("title"),copy=document.getElementById("copy"),status=document.getElementById("status"),retry=document.getElementById("retry"),dots=document.getElementById("dots"),kicker=document.getElementById("kicker");
if(es){
 document.documentElement.lang="es";
 kicker.textContent="BOOKING PAGE + CLEANING APP";
 title.textContent="Abriendo tu pago seguro…";
 copy.textContent="$39.99 pago único · Booking Page profesional + 2 meses de Cleaning App.";
 status.textContent="Continuarás de forma segura con Stripe.";
 retry.textContent="Intentar otra vez";
}
async function openCheckout(){
 retry.hidden=true; dots.hidden=false;
 status.textContent=es?"Continuarás de forma segura con Stripe.":"You’ll continue securely with Stripe.";
 try{
  const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.url) throw new Error("checkout");
  try{if(typeof gtag==="function")gtag("event","begin_checkout",{items:[{item_name:"Booking Page + Cleaning App"}],value:39.99,currency:"USD"});}catch{}
  setTimeout(()=>location.replace(data.url),120);
 }catch{
  dots.hidden=true;
  title.textContent=es?"No pudimos abrir el pago.":"We couldn’t open checkout.";
  status.textContent=es?"No se hizo ningún cobro. Inténtalo otra vez.":"No charge was made. Please try again.";
  retry.hidden=false;
 }
}
retry.addEventListener("click",openCheckout);
openCheckout();
</script>
</body>
</html>
