<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#58D6CF"><title>Private Lead Tracker | The Launch Era</title><link rel="icon" href="/the-launch-era-favicon.png"><style>
:root{--bg:#F8FAF9;--white:#fff;--aqua:#58D6CF;--ice:#E8F8F6;--teal:#087F79;--ink:#191919;--muted:#64706d;--line:#d7e3e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--line);background:#fff}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;letter-spacing:.04em}.private{font-size:11px;font-weight:800;background:var(--ice);color:var(--teal);padding:8px 10px;border-radius:999px}.hero{padding:50px 0 28px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--teal)}h1{font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:-.05em;margin:10px 0}.lead{color:var(--muted);max-width:720px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0}.stat{background:#fff;border:1px solid var(--line);padding:18px}.stat b{display:block;font-size:30px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:22px 0}.toolbar select,.toolbar button{padding:10px 12px;border:1px solid var(--line);background:#fff;font:inherit}.toolbar button{cursor:pointer;font-weight:700}.leadlist{display:grid;gap:10px;padding-bottom:60px}.lead-card{background:#fff;border:1px solid var(--line);padding:20px}.top{display:flex;justify-content:space-between;gap:16px}.name{font-size:20px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px}.status{font-size:11px;font-weight:900;padding:7px 9px;background:var(--ice);color:var(--teal);height:max-content;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.actions button{border:1px solid var(--ink);background:#fff;padding:9px 11px;font-weight:700;cursor:pointer}.actions .book{background:var(--ink);color:#fff}.actions .contact{background:var(--aqua)}.empty,.error{background:#fff;border:1px solid var(--line);padding:28px;color:var(--muted)}.loading{padding:50px 0;color:var(--muted)}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.top{display:block}.status{display:inline-block;margin-top:12px}.toolbar{align-items:stretch;flex-direction:column}.actions button{flex:1 1 46%}}</style></head>
<body><header><div class="wrap nav"><div class="brand">THE LAUNCH ERA</div><div class="private">PRIVATE LEAD TRACKER</div></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">BOOKING FLOW</div><h1 id="business">Your leads, in one place.</h1><p class="lead" id="sub">New booking and quote requests will appear here automatically. Update the status and the follow-up system reacts with you.</p><div class="summary"><div class="stat"><b id="sNew">—</b><span>New</span></div><div class="stat"><b id="sContacted">—</b><span>Contacted</span></div><div class="stat"><b id="sBooked">—</b><span>Booked</span></div><div class="stat"><b id="sTotal">—</b><span>Total</span></div></div></section>
<div class="toolbar"><select id="filter"><option value="all">All leads</option><option value="new">New</option><option value="contacted">Contacted</option><option value="booked">Booked</option><option value="closed">Closed</option><option value="lost">Lost</option></select><button id="refresh">Refresh</button></div>
<div id="list" class="leadlist"><div class="loading">Loading your private tracker…</div></div></main>
<script>
const endpoint="https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-booking-flow-tracker";
const token=new URLSearchParams(location.search).get("token")||"";let all=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(payload){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,...payload})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load tracker.");return d}
function counts(){document.getElementById("sNew").textContent=all.filter(x=>x.status==="new").length;document.getElementById("sContacted").textContent=all.filter(x=>x.status==="contacted").length;document.getElementById("sBooked").textContent=all.filter(x=>x.status==="booked").length;document.getElementById("sTotal").textContent=all.length}
function render(){const f=document.getElementById("filter").value,rows=f==="all"?all:all.filter(x=>x.status===f),el=document.getElementById("list");counts();if(!rows.length){el.innerHTML='<div class="empty">No leads in this view yet.</div>';return}el.innerHTML=rows.map(x=>'<article class="lead-card"><div class="top"><div><div class="name">'+esc(x.customer_name)+'</div><div class="meta"><span>'+esc(x.request_type)+'</span><span>'+esc(x.service_name||"Service not specified")+'</span><span>'+esc(x.customer_email)+'</span><span>'+esc(x.customer_phone||"")+'</span></div></div><span class="status">'+esc(x.status)+'</span></div><div class="actions"><button class="book" data-id="'+x.id+'" data-status="booked">Booked</button><button class="contact" data-id="'+x.id+'" data-status="contacted">Contacted</button><button data-id="'+x.id+'" data-status="pause">Pause follow-up</button><button data-id="'+x.id+'" data-status="closed">Close</button></div></article>').join("");el.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.status))}
async function load(){try{const d=await api({action:"list"});all=d.leads||[];document.getElementById("business").textContent=(d.account?.business_name||"Your business")+" leads";render()}catch(e){document.getElementById("list").innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function update(id,status){try{const d=await api({action:"update",lead_id:id,status});all=d.leads||[];render()}catch(e){alert(e.message)}}
document.getElementById("filter").onchange=render;document.getElementById("refresh").onclick=load;load();
</script></body></html>
