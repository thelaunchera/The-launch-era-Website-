<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF8F3">
<title>Private Lead Tracker | The Launch Era</title>
<link rel="icon" href="/the-launch-era-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF8F3;--paper:#fff;--ink:#191919;--muted:#6B706E;--line:#E2E5E2;--blue:#C7E7FA;--blue2:#EDF7FC;--deep:#355F78;--yellow:#F2D85B}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Futura,"Avenir Next",Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 26px));margin:auto}
header{background:rgba(250,248,243,.96);border-bottom:1px solid rgba(25,25,25,.08);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-family:Prompt,Arial,sans-serif;font-weight:800;letter-spacing:.03em}.private{font-size:9px;font-weight:900;letter-spacing:.06em;background:var(--blue2);color:var(--deep);padding:8px 10px;border-radius:999px}
.hero{padding:34px 0 18px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--deep)}h1,h2,h3{font-family:Prompt,Arial,sans-serif;letter-spacing:-.035em}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:8px 0}.hero p{color:var(--muted);font-size:13px;line-height:1.5;max-width:680px;margin:0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.stat b{display:block;font-family:Prompt,Arial,sans-serif;font-size:28px}.stat span{font-size:9px;color:var(--muted);font-weight:800}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:14px 0 18px}.toolbar select,.toolbar button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;font:inherit;font-size:11px}.toolbar button{font-weight:900;cursor:pointer}.leadlist{display:grid;gap:12px;padding-bottom:60px}
.lead-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:start}.name{font-family:Prompt,Arial,sans-serif;font-size:21px;font-weight:800}.meta{font-size:9px;color:var(--muted);margin-top:4px}.head-badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.status{font-size:8px;font-weight:900;padding:7px 8px;background:var(--blue2);color:var(--deep);border-radius:999px;text-transform:uppercase;white-space:nowrap}.attention-badge{font-size:8px;font-weight:900;padding:7px 8px;background:var(--yellow);color:var(--ink);border-radius:999px;text-transform:uppercase;white-space:nowrap}
.snapshot{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.snap{background:#F8F9F7;border:1px solid #ECEEEC;border-radius:10px;padding:10px;min-width:0}.snap span{display:block;color:var(--muted);font-size:8px;font-weight:800;margin-bottom:4px}.snap strong{display:block;font-size:10px;line-height:1.35;overflow-wrap:anywhere}
.stage-label{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.07em;margin:2px 0 7px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stage{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 5px;font-size:8px;font-weight:900;color:#7C817E;cursor:pointer}.stage.active{background:var(--blue);border-color:#ADD7EF;color:var(--ink)}.stage.done{background:#F0F6F8;color:var(--deep);border-color:#D6E8F2}
.details{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:13px;padding-top:2px;border-top:1px solid var(--line)}.detail{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #F0F1EF;font-size:9px}.detail span{color:var(--muted)}.detail strong{text-align:right;overflow-wrap:anywhere}.detail.full{grid-column:1/-1}.detail.full strong{max-width:70%}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.actions button{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:9px 10px;font-size:8px;font-weight:900;cursor:pointer}.actions .book{background:var(--ink);color:#fff}.actions .soft{background:var(--blue2);border-color:#B9DCEE;color:var(--deep)}.actions .quiet{border-color:var(--line);color:var(--muted)}
.follow{margin-top:10px;font-size:8px;color:var(--muted);line-height:1.4}.follow-card{margin-top:11px;background:var(--blue2);border:1px solid #D5EAF5;border-radius:9px;padding:10px 11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.follow-card span{font-size:8px;color:var(--muted);font-weight:800}.follow-card strong{font-size:10px;text-align:right}.follow-card.due{background:#FFF8D8;border-color:#EEDC7A}.empty,.error,.loading{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--muted);font-size:12px}
@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.toolbar{align-items:stretch;flex-direction:column}.snapshot{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}.detail.full{grid-column:auto}.stage{padding:9px 3px;font-size:7px}.actions button{flex:1 1 30%}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">THE LAUNCH ERA</div><div class="private">PRIVATE LEAD TRACKER</div></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">AUTOMATED LEAD TRACKING</div><h1 id="business">Your leads, in one place.</h1><p id="sub">Every booking or quote request lands here with the details you need to review it, follow up and move it forward.</p>
<div class="summary"><div class="stat"><b id="sNew">—</b><span>NEW</span></div><div class="stat"><b id="sProgress">—</b><span>IN PROGRESS</span></div><div class="stat"><b id="sBooked">—</b><span>BOOKED</span></div><div class="stat"><b id="sTotal">—</b><span>TOTAL</span></div></div></section>
<div class="toolbar"><select id="filter"><option value="all">All leads</option><option value="new">New</option><option value="reviewing">Reviewing</option><option value="quoted">Quote / Confirm</option><option value="booked">Booked</option><option value="closed">Closed</option><option value="lost">Lost</option></select><button id="refresh">Refresh</button></div>
<div id="list" class="leadlist"><div class="loading">Loading your private tracker…</div></div>
</main>
<script>
const endpoint="https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-booking-flow-tracker";
const params=new URLSearchParams(location.search);
const token=params.get("token")||"";
const demoMode=params.get("demo")==="1";
let all=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const val=(x,...keys)=>{for(const k of keys){const v=x?.raw_payload?.[k]??x?.[k];if(v!==null&&v!==undefined&&String(v).trim())return String(v).trim()}return""};
const stage=x=>x.workflow_stage||({new:"new",contacted:"reviewing",booked:"booked",closed:"closed",lost:"lost"}[x.status]||"new");
const stageLabel=s=>({new:"New",reviewing:"Reviewing",quoted:"Quote / Confirm",booked:"Booked",closed:"Closed",lost:"Lost"}[s]||s);
const stageText=(x,s)=>s==="quoted"?(x.request_type==="quote"?"Custom Quote":"Confirm"):stageLabel(s);
const fmtDate=x=>{if(!x)return"";try{return new Date(x).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch{return x}};
function property(x){return [val(x,"property_type"),val(x,"bedrooms")?val(x,"bedrooms")+" bed":"",val(x,"bathrooms")?val(x,"bathrooms")+" bath":"",val(x,"square_footage")].filter(Boolean).join(" · ")||"—"}
function timing(x){return [val(x,"requested_date"),val(x,"requested_time")].filter(Boolean).join(" · ")||fmtDate(x.requested_start_at)||"—"}
function estimate(x){return x.request_type==="quote"?"Custom quote":(val(x,"estimate_display")||"—")}
function counts(){document.getElementById("sNew").textContent=all.filter(x=>stage(x)==="new").length;document.getElementById("sProgress").textContent=all.filter(x=>["reviewing","quoted"].includes(stage(x))).length;document.getElementById("sBooked").textContent=all.filter(x=>stage(x)==="booked").length;document.getElementById("sTotal").textContent=all.length}
function render(){
 const f=document.getElementById("filter").value,rows=f==="all"?all:all.filter(x=>stage(x)===f),el=document.getElementById("list");counts();
 if(!rows.length){el.innerHTML='<div class="empty">No leads in this view yet.</div>';return}
 el.innerHTML=rows.map(x=>{const s=stage(x),due=!!(x.follow_up_at&&new Date(x.follow_up_at).getTime()<=Date.now()),needs=s==="new"||due,follow=x.follow_up_at?(due?"Due now":fmtDate(x.follow_up_at)):((["booked","closed","lost"].includes(s))?"Closed":"Not scheduled");const extras=val(x,"extras"),freq=val(x,"frequency"),notes=val(x,"notes")||x.notes||"";
 return '<article class="lead-card"><div class="top"><div><div class="name">'+esc(x.customer_name)+'</div><div class="meta">'+esc(x.request_type==="quote"?"QUOTE REQUEST":"BOOKING REQUEST")+' · '+esc(x.service_name||"Service not specified")+'</div></div><div class="head-badges">'+(needs?'<span class="attention-badge">Needs attention</span>':'')+'<span class="status">'+esc(stageText(x,s))+'</span></div></div>'+
 '<div class="snapshot"><div class="snap"><span>REQUEST</span><strong>'+esc(x.service_name||"—")+'</strong></div><div class="snap"><span>PROPERTY</span><strong>'+esc(property(x))+'</strong></div><div class="snap"><span>PREFERRED TIME</span><strong>'+esc(timing(x))+'</strong></div><div class="snap"><span>ESTIMATE</span><strong>'+esc(estimate(x))+'</strong></div></div>'+
 '<div class="stage-label">MOVE THIS LEAD</div><div class="stages">'+["new","reviewing","quoted","booked"].map((st,i)=>{const order=["new","reviewing","quoted","booked"],cur=order.indexOf(s),cl=st===s?" active":(cur>i?" done":"");return '<button class="stage'+cl+'" data-id="'+x.id+'" data-status="'+st+'">'+stageText(x,st)+'</button>'}).join("")+'</div>'+
 '<div class="details"><div class="detail"><span>Client</span><strong>'+esc(x.customer_name||"—")+'</strong></div><div class="detail"><span>Phone</span><strong>'+esc(x.customer_phone||"—")+'</strong></div><div class="detail"><span>Email</span><strong>'+esc(x.customer_email||"—")+'</strong></div><div class="detail"><span>Address</span><strong>'+esc(x.service_address||"—")+'</strong></div><div class="detail"><span>Frequency</span><strong>'+esc(freq||"—")+'</strong></div><div class="detail"><span>Extras</span><strong>'+esc(extras||"None")+'</strong></div>'+(notes?'<div class="detail full"><span>Notes</span><strong>'+esc(notes)+'</strong></div>':'')+'</div>'+
 '<div class="follow-card'+(due?' due':'')+'"><span>'+(x.follow_up_at?(due?'FOLLOW-UP':'NEXT FOLLOW-UP'):'FOLLOW-UP')+'</span><strong>'+esc(follow)+'</strong></div><div class="actions"><button class="soft" data-id="'+x.id+'" data-status="'+(x.follow_up_at?"pause":"restart")+'">'+(x.follow_up_at?"Pause follow-up":"Restart follow-up")+'</button><button class="quiet" data-id="'+x.id+'" data-status="closed">Close</button><button class="quiet" data-id="'+x.id+'" data-status="lost">Lost</button></div></article>'}).join("");
 el.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.status));
}
async function api(payload){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,...payload})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load tracker.");return d}
async function load(){
 if(demoMode){
  all=[{
   id:"demo-lead-1",request_type:"booking",customer_name:"Jordan M.",customer_email:"jordan@example.com",customer_phone:"(555) 014-2810",
   service_name:"Standard Cleaning",service_address:"123 Sample St.",status:"new",workflow_stage:"new",
   follow_up_at:new Date(Date.now()+86400000).toISOString(),notes:"Dog in home; please text before arrival.",
   raw_payload:{property_type:"House",bedrooms:"3",bathrooms:"2",square_footage:"1,000–1,999 sq ft",frequency:"One time",extras:"Inside oven",estimate_display:"$145–$170",requested_date:"Monday, Oct 5",requested_time:"10:30 AM"}
  }];
  document.getElementById("business").textContent="Luma Home Cleaning leads";
  document.querySelector(".private").textContent="PRIVATE LEAD TRACKER · DEMO";
  render(); return;
 }
 try{const d=await api({action:"list"});all=d.leads||[];document.getElementById("business").textContent=(d.account?.business_name||"Your business")+" leads";render()}catch(e){document.getElementById("list").innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function update(id,status){
 if(demoMode){
  const x=all.find(v=>v.id===id); if(!x)return;
  if(status==="restart"){x.workflow_stage="reviewing";x.status="contacted";x.follow_up_at=new Date(Date.now()+86400000).toISOString();}
  else if(status==="pause"){x.follow_up_at=null;}
  else if(status==="new"){x.workflow_stage="new";x.status="new";x.follow_up_at=new Date(Date.now()+86400000).toISOString();}
  else if(status==="reviewing"||status==="contacted"){x.workflow_stage="reviewing";x.status="contacted";}
  else if(status==="quoted"){x.workflow_stage="quoted";x.status="contacted";x.follow_up_at=new Date(Date.now()+86400000).toISOString();}
  else if(status==="booked"){x.workflow_stage="booked";x.status="booked";x.follow_up_at=null;}
  else if(status==="closed"){x.workflow_stage="closed";x.status="closed";x.follow_up_at=null;}
  else if(status==="lost"){x.workflow_stage="lost";x.status="lost";x.follow_up_at=null;}
  render(); return;
 }
 try{const d=await api({action:"update",lead_id:id,status});all=d.leads||[];render()}catch(e){alert(e.message)}
}
document.getElementById("filter").onchange=render;document.getElementById("refresh").onclick=load;load();
</script>
</body></html>
