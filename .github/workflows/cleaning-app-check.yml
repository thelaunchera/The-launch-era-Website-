name: Cleaning App Build Check

on:
  push:
    branches: [cleaning-app-build]
    paths:
      - "cleaning-app/**"
      - ".github/workflows/cleaning-app-check.yml"
  pull_request:
    paths:
      - "cleaning-app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleaning-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cleaning-app/package.json
      - run: npm install
      - run: npm run build
