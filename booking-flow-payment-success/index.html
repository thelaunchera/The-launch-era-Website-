<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#58D6CF"><title>Payment Received | The Launch Era</title>
<style>:root{--bg:#F8FAF9;--ice:#E8F8F6;--teal:#087F79;--ink:#191919;--muted:#66706d;--line:#d7e3e0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);padding:36px}.check{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ice);color:var(--teal);font-size:24px;font-weight:900}h1{font-size:40px;line-height:1;margin:18px 0 12px}p{color:var(--muted);line-height:1.65}.brand{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--teal)}.status{margin-top:18px;padding:14px;background:var(--ice);color:var(--teal);font-weight:700;font-size:13px}</style></head>
<body><main class="card"><div class="brand">THE LAUNCH ERA</div><div class="check">✓</div><h1>Payment received.</h1><p>Your Booking Flow Setup is now entering onboarding.</p><div class="status" id="status">Verifying your Stripe payment and preparing your private intake…</div><p>You only need to complete one intake for your Booking Page, Private Lead Tracker and follow-up setup.</p></main>
<script>
(async()=>{
 const status=document.getElementById("status");
 const sessionId=new URLSearchParams(location.search).get("session_id")||"";
 if(!sessionId){status.textContent="Your payment was received. We’ll email your private intake after verification.";return}
 try{
  const r=await fetch("https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-booking-flow-stripe-complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||"verification");
  status.textContent=d.already_sent?"Your private intake has already been sent to your checkout email.":"Your private intake is on the way to the email you used in Stripe.";
 }catch(e){
  status.textContent="Your payment is safe. We’re still verifying it before sending the intake.";
 }
})();
</script></body></html>
