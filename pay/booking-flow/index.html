<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#58D6CF">
<title>Secure Checkout | The Launch Era</title>
<link rel="canonical" href="https://thelaunchera.com/pay/booking-flow/">
<style>
:root{--bg:#F8FAF9;--white:#fff;--aqua:#58D6CF;--ice:#E8F8F6;--teal:#087F79;--ink:#191919;--muted:#66706d;--line:#d7e3e0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
.card{width:min(540px,100%);background:#fff;border:1px solid var(--line);padding:34px}.brand{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--teal)}
.kicker{display:inline-block;margin-top:22px;background:var(--ice);color:var(--teal);padding:8px 10px;font-size:11px;font-weight:900}
h1{font-size:38px;line-height:1.02;letter-spacing:-.04em;margin:16px 0 10px}p{color:var(--muted);line-height:1.6}
.price{font-weight:900;font-size:30px;margin:20px 0}.dots{display:flex;gap:6px;margin:20px 0}.dots span{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:p 1s infinite ease-in-out}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.25;transform:scale(.8)}}
.checkout-countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:14px 0 18px}
.checkout-time{display:grid;place-items:center;gap:2px;min-height:52px;padding:7px 5px;border:1px solid var(--line);background:var(--ice)}
.checkout-time b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.checkout-time span{font-size:7px;font-weight:900;letter-spacing:.11em;color:var(--teal)}
.checkout-ended{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--muted)}
button{width:100%;padding:14px 18px;border:0;background:var(--ink);color:#fff;font-weight:900;cursor:pointer}button[hidden]{display:none}.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
<div class="brand">THE LAUNCH ERA</div>
<div class="kicker" id="checkoutKicker">SECURE CHECKOUT</div>
<h1>Opening your Booking Flow checkout…</h1>
<p>Custom Booking Page + Private Lead Tracker + automatic inquiry follow-up.</p>
<div class="price" id="checkoutPrice"><span id="checkoutOldPrice" style="font-size:18px;font-weight:700;color:#8a9491;text-decoration:line-through;margin-right:8px">$99</span><span id="checkoutCurrentPrice">$29.99</span> <span id="checkoutPriceNote" style="font-size:13px;font-weight:500;color:#66706d">one-time</span></div>
<div class="checkout-countdown" id="checkoutCountdown" aria-label="Offer time remaining">
  <span class="checkout-time"><b id="checkoutDays">07</b><span>DAYS</span></span>
  <span class="checkout-time"><b id="checkoutHours">00</b><span>HRS</span></span>
  <span class="checkout-time"><b id="checkoutMinutes">00</b><span>MIN</span></span>
  <span class="checkout-time"><b id="checkoutSeconds">00</b><span>SEC</span></span>
</div>
<div class="dots" id="dots"><span></span><span></span><span></span></div>
<button id="retry" hidden>Try again</button>
<p class="small" id="status">You’ll review your order before completing payment.</p>
</main>
<script src="/assets/analytics.js"></script>
<script>
const lang=new URLSearchParams(location.search).get("lang")==="es"?"es":"en";
try{sessionStorage.setItem("tleCheckoutLanguage",lang)}catch{}
if(lang==="es"){
 document.documentElement.lang="es";document.title="Pago seguro | The Launch Era";
 document.querySelector("h1").textContent="Abriendo el pago de tu Booking Flow…";
 document.querySelector("h1 + p").textContent="Página de reservas personalizada + registro privado de prospectos + seguimiento automático de consultas.";
 document.getElementById("checkoutKicker").textContent="PAGO SEGURO";
 document.getElementById("checkoutPriceNote").textContent="pago único";
 document.getElementById("retry").textContent="Intentar de nuevo";
 document.querySelectorAll(".checkout-time span").forEach((el,i)=>el.textContent=["DÍAS","HRS","MIN","SEG"][i]);
}
const endpoint="https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/create-tle-service-checkout";
const retry=document.getElementById("retry"),dots=document.getElementById("dots"),status=document.getElementById("status");
const saleEnd=new Date("2026-10-11T11:01:04Z").getTime();
const countdown=document.getElementById("checkoutCountdown");
const cdDays=document.getElementById("checkoutDays"),cdHours=document.getElementById("checkoutHours"),cdMinutes=document.getElementById("checkoutMinutes"),cdSeconds=document.getElementById("checkoutSeconds");
const pad=value=>String(value).padStart(2,"0");
function renderCheckoutCountdown(){
 const remaining=Math.max(0,saleEnd-Date.now());
 if(remaining<=0){
  document.getElementById("checkoutKicker").textContent=lang==="es"?"PAGO SEGURO":"SECURE CHECKOUT";
  document.getElementById("checkoutOldPrice").style.display="none";
  document.getElementById("checkoutCurrentPrice").textContent="$99";
  document.getElementById("checkoutPriceNote").textContent=lang==="es"?"precio regular · pago único":"regular price · one-time";
  if(countdown) countdown.innerHTML='<span class="checkout-ended">'+(lang==="es"?"Esta oferta terminó.":"This offer has ended.")+'</span>';
  return;
 }
 const totalSeconds=Math.floor(remaining/1000);
 const d=Math.floor(totalSeconds/86400);
 const h=Math.floor((totalSeconds%86400)/3600);
 const m=Math.floor((totalSeconds%3600)/60);
 const s=totalSeconds%60;
 if(cdDays) cdDays.textContent=pad(d);
 if(cdHours) cdHours.textContent=pad(h);
 if(cdMinutes) cdMinutes.textContent=pad(m);
 if(cdSeconds) cdSeconds.textContent=pad(s);
 if(countdown) countdown.setAttribute("aria-label",d+" days, "+h+" hours, "+m+" minutes and "+s+" seconds remaining");
 setTimeout(renderCheckoutCountdown,250);
}
renderCheckoutCountdown();
let paymentStartTracked=false;
function trackPaymentStart(){
 if(paymentStartTracked)return;
 paymentStartTracked=true;
 const amount=Date.now()<saleEnd?29.99:99;
 window.tleTrackEvent?.("payment_start",{product:"booking_flow",amount,currency:"USD",language:lang});
}
async function openCheckout(){
 trackPaymentStart();
 retry.hidden=true;dots.hidden=false;status.textContent=lang==="es"?"Abriendo el pago seguro…":"Opening secure checkout…";
 try{
  const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({offer:"booking-flow",language:lang})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.url) throw new Error("checkout");
  const checkoutUrl=new URL(d.url);if(checkoutUrl.protocol!=="https:"||checkoutUrl.hostname!=="buy.stripe.com")throw new Error("checkout URL");checkoutUrl.searchParams.set("locale",lang);location.replace(checkoutUrl.href);
 }catch(e){
  dots.hidden=true;retry.hidden=false;status.textContent=lang==="es"?"No pudimos abrir el pago. Intenta de nuevo.":"We couldn’t open checkout. Please try again.";
 }
}
retry.onclick=openCheckout;openCheckout();
</script>
</body></html>
