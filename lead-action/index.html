<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lead Update | The Launch Era</title><link rel="icon" href="/the-launch-era-favicon.png"><style>
:root{--bg:#F8FAF9;--aqua:#58D6CF;--teal:#087F79;--ink:#191919;--muted:#66706d;--line:#d8e4e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);padding:34px}.brand{font-weight:800;letter-spacing:.05em;font-size:13px}.dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--aqua);font-weight:900;margin:28px 0 16px}h1{font-size:36px;line-height:1;margin:0 0 12px}p{color:var(--muted);line-height:1.6}.small{font-size:12px;margin-top:22px}.error .dot{background:#f4d6d6}.loading .dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}</style></head>
<body><main class="card loading" id="card"><div class="brand">THE LAUNCH ERA</div><div class="dot" id="icon">…</div><h1 id="title">Updating lead…</h1><p id="copy">Please keep this page open for a moment.</p><p class="small">Private Booking Flow action</p></main>
<script>
(async()=>{
 const p=new URLSearchParams(location.search),token=p.get("token")||"",action=p.get("action")||"";
 const card=document.getElementById("card"),icon=document.getElementById("icon"),title=document.getElementById("title"),copy=document.getElementById("copy");
 try{
  const r=await fetch("https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-booking-flow-lead-action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,action})});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||"Could not update this lead.");
  const labels={booked:"Booked",contacted:"Contacted",pause:"Follow-up paused",closed:"Closed",lost:"Closed as lost"};
  card.classList.remove("loading");icon.textContent="✓";title.textContent=labels[action]||"Updated";copy.textContent=(d.customer_name||"This lead")+" has been updated. You can close this page.";
 }catch(e){card.classList.remove("loading");card.classList.add("error");icon.textContent="!";title.textContent="We couldn't update this lead.";copy.textContent=e.message||"The link may have expired."}
})();
</script></body></html>
